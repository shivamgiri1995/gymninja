<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`; GitHub Pages serves under /gymninja/. -->
  <base href="/gymninja/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="GymNinja: free gym management. Members, fees, QR check-in and plans for owners; workouts, diet and progress for members.">
  <meta name="theme-color" content="#08090B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GymNinja">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GymNinja</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* shown until Flutter paints its first frame over it */
    @font-face { font-family: "KanitWm"; font-style: italic; font-weight: 900; font-display: swap;
                 src: url("assets/assets/fonts/Kanit-BlackItalic.ttf") format("truetype"); }
    html, body { margin: 0; height: 100%; background: #08090B; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
            background: radial-gradient(60% 45% at 50% 42%, rgba(240, 43, 43, .22), transparent 70%), #08090B; }
    #boot .ring { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
    #boot .ring img { width: 104px; height: 104px; border-radius: 24px; }
    #boot .ring::before { content: ""; position: absolute; inset: 0; border-radius: 34px; border: 3px solid rgba(240, 43, 43, .18);
                          border-top-color: #F02B2B; animation: spin 1s linear infinite; }
    #boot .name { font: italic 900 30px/1 "KanitWm", "Arial Black", Impact, sans-serif; letter-spacing: -.5px; color: #F3F3F5; }
    #boot .name b { color: #F02B2B; font-weight: inherit; }
    #boot .hint { color: #8C8E97; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot .ring::before { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-label="Loading GymNinja">
    <div class="ring"><img src="icons/Icon-192.png" alt=""></div>
    <div class="name">Gym<b>Ninja</b></div>
    <div class="hint">Getting your gym ready…</div>
  </div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
