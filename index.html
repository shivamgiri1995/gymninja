<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymNinja has moved</title>
<meta name="robots" content="noindex">
<script>
  // GymNinja moved off GitHub Pages in Oct 2026. Keep the path below /gymninja/,
  // the ?invite= query and the #/c/<code> of desk QRs printed before the move.
  (function () {
    var rest = location.pathname.replace(/^\/gymninja\/?/, '');
    location.replace('https://gymninja.duckdns.org/' + rest + location.search + location.hash);
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08090B; color: #F3F3F5;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; text-align: center; }
  a { color: #F02B2B; font-weight: 700; }
</style>
</head>
<body>
  <p>GymNinja has moved to<br><a href="https://gymninja.duckdns.org/">gymninja.duckdns.org</a></p>
</body>
</html>
